[package]
name = "lockline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Explains the locks your PostgreSQL migrations take and flags the dangerous ones"
keywords = ["postgres", "postgresql", "migrations", "linter", "locks"]
categories = ["command-line-utilities", "database", "development-tools"]

[dependencies]
pg_query = "6.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
owo-colors = "4"

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
